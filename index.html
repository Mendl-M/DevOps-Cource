<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REFAEL | DevOps Engineer | Matrix Terminal</title>
    <style>
        /* Base Reset & Matrix Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #000;
            color: #00ff00;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Matrix Background Canvas */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.8;
        }

        /* Header Styling */
        header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(0, 15, 0, 0.8);
            border-bottom: 2px solid #00ff00;
            box-shadow: 0 0 20px #00ff00;
        }

        header h1 {
            font-size: 3.5em;
            letter-spacing: 5px;
            text-shadow: 0 0 10px #00ff00, 0 0 20px #00aa00;
            animation: matrixGlow 2s ease-in-out infinite;
        }

        header h1::after {
            content: "_";
            animation: blink 1s infinite;
        }

        header p {
            font-size: 1.2em;
            margin-top: 10px;
            color: #00ff00;
            text-transform: uppercase;
        }

        /* Navigation */
        nav {
            background-color: rgba(0, 17, 0, 0.9);
            padding: 15px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 2px solid #00ff00;
            backdrop-filter: blur(5px);
        }

        nav a {
            color: #00ff00;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s;
            text-shadow: 0 0 5px #00ff00;
        }

        nav a:hover {
            color: #fff;
            text-shadow: 0 0 15px #00ff00;
            background: rgba(0, 255, 0, 0.1);
            padding: 5px 10px;
        }

        /* Container & Sections */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        section {
            background: rgba(0, 20, 0, 0.85);
            margin: 40px 0;
            padding: 30px;
            border: 2px solid #00ff00;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            transition: transform 0.3s ease;
        }

        section:hover {
            transform: scale(1.01);
            box-shadow: 0 0 25px rgba(0, 255, 0, 0.4);
        }

        h2 {
            color: #00ff00;
            margin-bottom: 20px;
            font-size: 2em;
            border-bottom: 3px solid #00ff00;
            padding-bottom: 10px;
            text-shadow: 0 0 10px #00ff00;
        }

        /* Skills Grid */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .skill-card {
            background: rgba(0, 40, 0, 0.5);
            padding: 20px;
            border: 1px solid #00ff00;
            transition: 0.3s;
        }

        .skill-card:hover {
            background: #00ff00;
            color: #000;
        }

        .skill-card h3 { margin-bottom: 10px; }
        .skill-card ul { list-style: none; }
        .skill-card liBefore { content: "> "; }

        /* Experience */
        .experience-item {
            margin-bottom: 30px;
            border-right: 3px solid #00ff00;
            padding-right: 20px;
        }

        .company { color: #fff; font-weight: bold; }
        .date { color: #00aa00; font-size: 0.9em; }
